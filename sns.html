<style>
:root{--z:1;--st:calc(env(safe-area-inset-top) / var(--z));--sb:calc(env(safe-area-inset-bottom) / var(--z));--ink:#0f1419;--gray:#536471;--line:#eff3f4;--blue:#1d9bf0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#fff;overflow:hidden}
body{color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","ヒラギノ角ゴシック","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;text-size-adjust:100%;font-size:15px;line-height:20px}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
svg{display:block;flex:none}
#app{position:relative;width:395px;margin:0 auto;overflow:hidden;background:#fff}
#main{position:absolute;inset:0;background:#fff;z-index:2;display:flex;flex-direction:column;overflow:hidden;transition:transform .28s cubic-bezier(.2,.8,.2,1),border-radius .28s}
#scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;position:relative}
.gray{color:var(--gray)}
.avatar{border-radius:50%;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden;font-weight:700;color:#fff}

/* ホーム */
.homehd{position:sticky;top:0;z-index:3;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding-top:var(--st)}
.homebar{height:60px;position:relative;display:flex;align-items:center;justify-content:center}
.homebar .me{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:32px;height:32px}
.homebar .dot{position:absolute;top:-1px;right:-1px;width:8px;height:8px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 2px #fff}
.htabs{display:flex;align-items:stretch;height:37px;border-bottom:.5px solid #e1e8ed;overflow-x:auto;scrollbar-width:none}
.htabs::-webkit-scrollbar{display:none}
.htab{flex:none;position:relative;display:flex;align-items:center;gap:4px;padding:0 0 3px;margin-left:12px;font-size:14.5px;font-weight:700;color:var(--gray);white-space:nowrap;max-width:128px;overflow:hidden}
.htab span{overflow:hidden;text-overflow:clip;-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent)}
.htab.first{padding:0 12px;margin-left:12px}
.htab:not(.first){margin-left:16px;padding:0 6px 3px}
.htab.on{color:var(--ink)}
.htab.on::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2.5px;border-radius:2px;background:var(--ink)}
.htab.add{margin-left:auto;padding:0 12px 3px 8px;color:var(--gray)}

/* ポスト */
.post{touch-action:manipulation;display:flex;padding:12px 9px 9px 9px;border-bottom:.5px solid #e1e8ed}
.post>.avatar{width:46px;height:46px;margin-top:2px}
.post .body{flex:1;min-width:0;margin-left:9px}
.meta{display:flex;align-items:center;gap:4px;font-size:15px;line-height:20px;white-space:nowrap;overflow:hidden}
.meta b{font-weight:700;overflow:hidden;text-overflow:ellipsis;flex:none;max-width:50%}
.meta .gray{overflow:hidden;text-overflow:ellipsis;min-width:0;font-weight:400}
.txt{font-size:15px;line-height:20.3px;white-space:pre-wrap;word-break:break-word;letter-spacing:0;padding-right:3px}
.txt.clamp{display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.more{color:var(--blue);font-size:15px;line-height:20px}
.quote{border:.5px solid #cfd9de;border-radius:16px;padding:12px 14px 13px;margin-top:11px}
.quote .meta{font-size:14.5px;gap:5px}
.quote .txt{margin-top:7px;font-size:14.5px;line-height:20.3px;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.promo{margin-top:11px;border-radius:16px;overflow:hidden;background:#24272b;color:#fff;padding:18px 14px}
.acts{display:flex;justify-content:space-between;align-items:center;height:30px;margin-top:5px;color:var(--gray);font-size:13.5px}
.act{height:30px;display:flex;align-items:center;gap:5px;color:var(--gray);min-width:22px}
.act:first-child{justify-content:flex-start}
.act.on-like{color:#f91880}.act.on-rt{color:#00ba7c}.act.on-bm{color:var(--blue)}

/* ナビ・FAB */
.nav{display:flex;justify-content:space-around;align-items:center;height:calc(46px + var(--sb));padding:0 12px var(--sb);border-top:.5px solid #e1e8ed;background:#fff;flex:none}
.nav button{width:52px;height:46px;display:flex;align-items:center;justify-content:center}
.fab{position:absolute;right:9px;bottom:calc(55px + var(--sb));width:55px;height:55px;border-radius:50%;background:var(--blue);box-shadow:0 2px 10px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;z-index:5}

/* プロフィール */
.cover{height:calc(108px + var(--st));background:linear-gradient(#8a8a8a,#a9a9a9)}
.circ{position:absolute;top:calc(var(--st) + 18px);width:39px;height:39px;border-radius:50%;background:rgba(15,20,25,.72);display:flex;align-items:center;justify-content:center}
.ptabs{display:flex;height:44px;margin-top:8px;border-bottom:.5px solid #e1e8ed}
.ptab{display:flex;align-items:center;justify-content:center;gap:6px;color:var(--gray);position:relative;height:44px}
.ptab.on{color:var(--ink)}
.ptab.on::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2.5px;border-radius:2px;background:var(--ink)}
.pbtn{flex:1;height:38px;border-radius:19px;border:1px solid #cfd9de;font-weight:700;font-size:14.5px}
.empty{padding:48px 24px;text-align:center;color:var(--gray);font-size:15px;line-height:22px}
.hd{padding:calc(var(--st) + 14px) 16px 14px;font-size:20px;font-weight:800;border-bottom:.5px solid #e1e8ed}

/* メニュー */
#drawer{position:absolute;top:0;bottom:0;left:0;width:316px;z-index:1;background:#fff;overflow-y:auto;padding:calc(var(--st) + 23px) 32px calc(24px + var(--sb))}
#scrim{position:absolute;inset:0;background:rgba(255,255,255,.55);opacity:0;pointer-events:none;transition:opacity .28s;z-index:10}
#app.drawer-open #main{transform:translateX(316px);border-radius:40px 0 0 40px;box-shadow:-0.5px 0 0 #e1e8ed,-6px 0 24px rgba(0,0,0,.06)}
#app.drawer-open #scrim{opacity:1;pointer-events:auto}
.mi{display:flex;align-items:center;width:100%;height:52px;font-size:19.5px;font-weight:800;letter-spacing:.01em;text-align:left}
.mi svg{margin-right:26px}
.mi.sm{height:43px;font-size:14.5px;font-weight:500;letter-spacing:0}
.mi.sm svg{margin-right:25px}
.badge{position:absolute;top:-6px;right:-8px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--blue);color:#fff;font-size:11px;font-weight:700;line-height:17px;text-align:center;box-shadow:0 0 0 1.5px #fff}

/* 投稿シート */
#sheet{position:absolute;inset:0;background:#fff;z-index:30;display:none;flex-direction:column;padding-top:var(--st)}
#sheet.open{display:flex}
#sheet textarea{flex:1;border:0;outline:0;resize:none;font:inherit;font-size:18px;line-height:26px;padding:8px 0;background:transparent;color:var(--ink)}
.submit{height:34px;padding:0 17px;border-radius:17px;font-weight:700;font-size:15px;background:var(--blue);color:#fff}
.submit:disabled{opacity:.5;cursor:default}
.tool{height:40px;padding:0 8px;display:flex;align-items:center;gap:6px;color:var(--blue);font-size:14px;font-weight:700;cursor:pointer;position:relative}
.tool input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.thumb{position:relative;width:76px;height:76px;flex:none;border-radius:12px;overflow:hidden;border:.5px solid #cfd9de}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:12px;background:rgba(15,20,25,.75);color:#fff;display:flex;align-items:center;justify-content:center}
#dlg{position:absolute;inset:0;background:rgba(15,20,25,.4);z-index:35;display:none;align-items:center;justify-content:center;padding:24px}
#dlg.open{display:flex}
.dlgbox{background:#fff;border-radius:16px;padding:20px;width:100%;max-width:320px;display:flex;flex-direction:column;gap:12px}
#dt{font:inherit;font-size:16px;padding:10px 12px;border:1px solid #cfd9de;border-radius:8px;width:100%;color:var(--ink);background:#fff}
.mgrid{margin-top:10px;border-radius:16px;overflow:hidden;border:.5px solid #cfd9de;display:grid;gap:2px;aspect-ratio:16/10;background:#eff3f4}
.mgrid img{width:100%;height:100%;object-fit:cover;display:block;min-height:0}
#toast{position:absolute;left:50%;bottom:calc(70px + var(--sb));transform:translateX(-50%);background:var(--blue);color:#fff;padding:10px 16px;border-radius:6px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40;white-space:nowrap}
#toast.show{opacity:1}
</style>
</head>
<body>
<div id="app">
  <aside id="drawer" aria-label="メニュー"></aside>
  <div id="main">
    <div id="scroll"></div>
    <button class="fab" id="fab" aria-label="ポストを作成"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" aria-hidden="true"><path d="M12 3v18M3 12h18"/></svg></button>
    <nav class="nav" id="nav"></nav>
    <div id="scrim"></div>
  </div>
  <div id="sheet">
    <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 12px">
      <button id="cancel" style="height:44px;padding:0 6px;font-size:16px">キャンセル</button>
      <button class="submit" id="submit" disabled>ポストする</button>
    </div>
    <div style="display:flex;gap:10px;padding:6px 12px;flex:1;min-height:0">
      <div class="avatar" style="width:40px;height:40px" id="sheetAvatar"></div>
      <textarea id="ta" aria-label="いまどうしてる？" placeholder="いまどうしてる？" maxlength="400"></textarea>
    </div>
    <div id="previews" style="display:flex;gap:8px;padding:0 12px 10px 62px;overflow-x:auto"></div>
    <div style="display:flex;align-items:center;gap:4px;padding:4px 8px calc(4px + var(--sb));border-top:.5px solid #e1e8ed">
      <label class="tool" aria-label="画像を追加"><input type="file" id="file" accept="image/*" multiple><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="8.5" cy="9.5" r="1.8"/><path d="M21 16l-5-5-9 9"/></svg>画像</label>
      <button class="tool" id="dateBtn" aria-label="投稿日時を変更"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 9.8h17M8 3v3.5M16 3v3.5"/></svg><span id="dateLbl">今</span></button>
      <span class="gray" id="count" style="margin-left:auto;padding-right:8px;font-size:14px"></span>
    </div>
  </div>
  <div id="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgT">
    <div class="dlgbox">
      <div id="dlgT" style="font-weight:800;font-size:17px">投稿日時を変更</div>
      <label for="dt" class="gray" style="font-size:13px;margin-bottom:-6px">日付と時刻</label>
      <input type="datetime-local" id="dt">
      <button id="dlgNow" style="align-self:flex-start;color:var(--blue);font-size:14px;font-weight:700;height:32px">現在の時刻にする</button>
      <div style="display:flex;justify-content:flex-end;gap:8px">
        <button id="dlgCancel" style="height:36px;padding:0 14px;font-size:15px;font-weight:700">キャンセル</button>
        <button id="dlgOk" class="submit">決定</button>
      </div>
    </div>
  </div>
  <div id="toast" role="status"></div>
</div>

function av(u,size){

  if(u.svg)return `<div class="avatar" style="width:${size}px;height:${size}px;border-color:#e1e8ed;${u.square?'border-radius:'+(size*.18)+'px':''}"><svg width="${size}" height="${size}" viewBox="0 0 40 40" aria-hidden="true">${u.svg}</svg></div>`;
  return `<div class="avatar" style="width:${size}px;height:${size}px;background:${u.color};border-color:${u.color};font-size:${size*.42}px;${u.square?'border-radius:'+(size*.18)+'px':''}">${esc(u.name[0])}</div>`;
}
function norm(p){

}
function gridHTML(imgs){
  const n=Math.min(imgs.length,4);

  return `<div class="mgrid" style="grid-template-columns:${cols};grid-template-rows:${rows}">${imgs.slice(0,4).map((src,i)=>`<img src="${src}" alt="添付画像${n>1?(i+1):''}" style="${n===3&&i===0?'grid-row:span 2':''}">`).join('')}</div>`;
}

    :`<div class="meta"><b>${esc(u.name)}</b>${u.locked?LOCK(15):''}${u.official?GOLD:''}<span class="gray">@${u.handle}<span style="padding:0 3px">·</span>${p.dateLabel}</span></div>`;
  const q=p.quote?(()=>{const qu=U[p.quote.u];return `<div class="quote"><div class="meta">${av(qu,20)}<b>${esc(qu.name)}</b><span class="gray">@${qu.handle}<span style="padding:0 3px">·</span>${ago(p.quote.t)}</span></div><div class="txt">${esc(p.quote.text)}</div></div>`})():'';
  const promo=p.promo?`<div class="promo"><div style="font-size:11px;letter-spacing:.12em;opacity:.8">48時間限定</div><div style="font-size:28px;line-height:34px;font-weight:800;margin:4px 0 12px">冬のまとめ割</div><div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">${[['ソウル','3日間'],['台北','3日間'],['バンコク','4日間']].map(([c,d])=>`<div style="background:#fff;color:#0f1419;border-radius:10px;padding:8px 4px;text-align:center"><div style="font-size:10.5px;line-height:14px;color:#536471">${d}</div><div style="font-weight:800;font-size:14px">${c}</div><div style="font-weight:800;color:#c0306a;font-size:13px">[価格]</div></div>`).join('')}</div></div>`:'';
  return `<article class="post" data-id="${p.id}" data-mine="${p.kind==='m'?1:0}">
    ${av(u,46)}
    <div class="body">
      ${head}
      <div class="txt ${long&&!opened?'clamp':''}">${esc(p.text)}</div>${long&&!opened?'<button class="more" data-a="more">さらに表示</button>':''}
      ${q}${promo}${p.images&&p.images.length?gridHTML(p.images):''}${p.photo?`<div style="margin-top:10px;border-radius:16px;overflow:hidden;border:.5px solid #cfd9de;aspect-ratio:16/10;background:#eff3f4"><img src="${PHOTOS[p.photo]}" alt="添付画像" style="display:block;width:100%;height:100%;object-fit:cover"></div>`:''}
      <div class="acts">
        <button class="act" aria-label="返信" data-toast="返信はデモでは動きません">${I.reply}${fmt(p.replies)}</button>
        <button class="act ${p.rt?'on-rt':''}" data-a="rt" aria-label="リポスト" aria-pressed="${!!p.rt}">${I.rt}${fmt(p.rts)}</button>
        <button class="act ${p.liked?'on-like':''}" data-a="like" aria-label="いいね" aria-pressed="${!!p.liked}">${I.like(p.liked)}${fmt(p.likes)}</button>
        <span class="act">${I.views}${fmt(p.views)}</span>
        <span style="display:flex;gap:22px">
          <button class="act ${p.bm?'on-bm':''}" data-a="bm" aria-label="ブックマーク" aria-pressed="${!!p.bm}">${I.bm(p.bm)}</button>
          ${p.kind==='m'?`<button class="act" data-a="del" aria-label="削除">${I.del}</button>`:`<button class="act" aria-label="共有" data-toast="共有はデモでは動きません">${I.share}</button>`}
        </span>
      </div>
    </div></article>`;
}
function profList(tab){
  if(tab==='posts')return state.posts.length?state.posts.map(postHTML).join(''):'<div class="empty">まだポストがありません。右下の＋から投稿してみましょう。</div>';
  if(tab==='reposts'){const l=[...state.posts,...state.others].filter(p=>p.rt);return l.length?l.map(postHTML).join(''):'<div class="empty">リポストしたポストはまだありません。</div>';}
  if(tab==='replies')return '<div class="empty">返信はまだありません。</div>';
  return '<div class="empty">メディアはまだありません。</div>';
}
function homeList(){
  const o=state.others,m=state.posts;let l;
  if(state.htab==='rec'){l=[...o];if(m[0])l.splice(3,0,m[0]);if(m[1])l.splice(12,0,m[1]);}
  else if(state.htab==='following'){l=[...m,...o.filter(p=>p.following)].sort((a,b)=>(b.t||b.id)-(a.t||a.id));}
  else l=o.filter(p=>p.list);
  return l.map(postHTML).join('')||'<div class="empty">ポストはまだありません。</div>';
}
const CHEV='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';

    h=`<div class="cover"></div>

    <button class="circ" style="right:16px" aria-label="検索" data-go="search"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" aria-hidden="true"><circle cx="10.8" cy="10.8" r="7"/><path d="M16 16l4.8 4.8"/></svg></button>
    <div style="padding:0 9px">
      <div class="avatar" style="width:79px;height:79px;margin-top:-15px;border:3px solid #fff;box-shadow:0 0 0 .5px #e1e8ed;position:relative"><img src="${ME.img}" alt="" style="width:100%;height:100%;object-fit:cover;display:block"></div>
      <div style="display:flex;align-items:center;gap:8px;margin-top:20px;padding-left:1px">
        <span style="font-size:20.5px;line-height:26px;font-weight:800;letter-spacing:.02em">ななな</span>
        <span style="display:inline-flex;align-items:center;gap:5px;border:1px solid #cfd9de;border-radius:12px;height:23px;padding:0 10px 0 11px;margin-left:3px;font-size:12.5px;font-weight:700"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.5l2.6 1.9 3.2-.2 1 3 2.7 1.8-1 3 1 3-2.7 1.8-1 3-3.2-.2L12 22.5l-2.6-1.9-3.2.2-1-3-2.7-1.8 1-3-1-3 2.7-1.8 1-3 3.2.2z" fill="#1d9bf0"/><path d="M8 12.3l2.7 2.7L16.2 9" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>認証を受ける</span>
      </div>
      <div class="gray" style="font-size:15.5px;line-height:20px;margin-top:4px;padding-left:1px">@udo6aq</div>
      <div class="gray" style="display:flex;align-items:center;gap:5px;margin-top:14px;font-size:14px;line-height:18px">${sv('<rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 9.8h17M8 3v3.5M16 3v3.5"/>',15,1.8)}2022年3月から利用しています${sv('<path d="M9 6l6 6-6 6"/>',13,2)}</div>
      <div class="gray" style="display:flex;gap:13px;margin-top:11px;font-size:13px;line-height:18px;padding-left:1px"><span><b style="color:#0f1419;font-size:14.5px;font-weight:700">104</b> フォロー中</span><span><b style="color:#0f1419;font-size:14.5px;font-weight:700">176</b> フォロワー</span></div>
      <div style="display:flex;gap:9px;margin-top:17px"><button class="pbtn" data-toast="共有はデモでは動きません">プロフィールを共有</button><button class="pbtn" data-toast="編集はデモでは動きません">プロフィールを編集</button></div>
    </div>
    <div class="ptabs" role="tablist">${ptabs.map(([k,l,ic],i)=>`<button class="ptab ${state.tab===k?'on':''}" role="tab" aria-selected="${state.tab===k}" aria-label="${l}" data-tab="${k}" style="${i===0?'width:115px;margin:0 20px':'width:80px'}">${ic}${i===0?`<span style="font-size:15px;font-weight:800">ポスト</span><span class="gray" style="margin-left:4px">${CHEV}</span>`:''}</button>`).join('')}</div>
    ${profList(state.tab)}`;
  }else if(v==='home'){
    const tabs=[['rec','おすすめ'],['following','フォロー中'],['list','渡韓でバカみたいに']];
    h=`<div class="homehd"><div class="homebar">
        <button class="me" data-a2="drawer" aria-label="メニューを開く">${av(ME,32)}<span class="dot"></span></button>
      </div>
      <div class="htabs" role="tablist">${tabs.map(([k,l],i)=>`<button class="htab ${i===0?'first':''} ${state.htab===k?'on':''}" role="tab" aria-selected="${state.htab===k}" data-htab="${k}"><span>${l}</span>${i===0?`<span class="gray" style="-webkit-mask-image:none">${CHEV}</span>`:''}</button>`).join('')}<button class="htab add" aria-label="タブを追加" data-toast="タブの追加はデモでは動きません">${sv('<path d="M12 4.5v15M4.5 12h15"/>',18,2.2)}</button></div>
    </div>${homeList()}`;
  }else{
    const t={search:'検索',notif:'通知',dm:'メッセージ',community:'コミュニティ'}[v]||'';
    h=`<div class="hd">${t}</div><div class="empty">デモではこの画面は用意していません。</div>`;
  }
  $('scroll').innerHTML=h+'<div style="height:110px"></div>';
  $('nav').innerHTML=NAV.map(([k,l,p,f])=>`<button data-go="${k}" aria-label="${l}" aria-current="${v===k}">${sv(p,24,v===k&&!f?2.3:1.75,f&&v===k?'fill="currentColor" stroke-width="0"':'')}</button>`).join('');
}
function renderDrawer(){
  const mini=(k,n)=>`<span style="position:relative;display:inline-flex">${av(U[k],23)}<span class="badge">${n}</span></span>`;
  $('drawer').innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center">
      <button data-go="profile" aria-label="プロフィールへ" style="margin-left:-1px">${av(ME,40)}</button>
      <div style="display:flex;align-items:center;gap:20px;margin-right:-11px">
        ${mini('kuma',5)}${mini('smile',4)}
        <button aria-label="アカウント" data-toast="アカウント切り替えはデモでは動きません" style="width:24px;height:24px">${sv('<circle cx="12" cy="12" r="10"/><circle cx="7.8" cy="12" r=".9" fill="currentColor"/><circle cx="12" cy="12" r=".9" fill="currentColor"/><circle cx="16.2" cy="12" r=".9" fill="currentColor"/>',24,1.6)}</button>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:6px;margin-top:12px;font-size:16px;line-height:22px;font-weight:800;letter-spacing:.02em">ななな</div>
    <div class="gray" style="font-size:15.5px;line-height:20px;margin-top:3px">@udo6aq</div>
    <div class="gray" style="display:flex;gap:13px;margin-top:10px;font-size:13.5px;line-height:18px"><span><b style="color:#0f1419;font-size:14.5px;font-weight:500">104</b> フォロー中</span><span><b style="color:#0f1419;font-size:14.5px;font-weight:500">176</b> フォロワー</span></div>
    <div style="margin-top:30px">${MENU.map(([k,l,p])=>`<button class="mi" data-menu="${k}">${sv(p,22,1.9)}${l}</button>`).join('')}</div>
    <div style="height:.5px;background:#e1e8ed;margin:16px 0 26px"></div>
    ${MENU2.map(([k,l,p])=>`<button class="mi sm" data-menu="${k}">${sv(p,19,1.7)}${l}</button>`).join('')}`;
}
const app=$('app');
const openDrawer=()=>app.classList.add('drawer-open');
const closeDrawer=()=>app.classList.remove('drawer-open');
$('scrim').onclick=closeDrawer;

function go(v){state.view=v;closeDrawer();render();$('scroll').scrollTop=0}
const find=id=>state.posts.find(x=>x.id===id)||state.others.find(x=>x.id===id);
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.go){go(t.dataset.go);return}
  if(t.dataset.a2==='drawer'){openDrawer();return}
  if(t.dataset.menu){if(t.dataset.menu==='profile')go('profile');else toast(t.textContent.trim()+'はデモでは動きません');return}
  if(t.dataset.tab){state.tab=t.dataset.tab;render();return}
  if(t.dataset.htab){state.htab=t.dataset.htab;render();$('scroll').scrollTop=0;return}
  if(t.dataset.toast){toast(t.dataset.toast);return}
  const a=t.dataset.a;if(a){
    const id=+t.closest('.post').dataset.id;const p=find(id);if(!p)return;
    if(a==='more')state.open[id]=true;
    if(a==='like'){p.liked=!p.liked;p.likes=(p.likes||0)+(p.liked?1:-1)}
    if(a==='rt'){p.rt=!p.rt;if(p.u)p.rts+=p.rt?1:-1;toast(p.rt?'リポストしました':'リポストを取り消しました')}
    if(a==='bm'){p.bm=!p.bm;toast(p.bm?'ブックマークに追加しました':'ブックマークから削除しました')}
    if(a==='del'){state.posts=state.posts.filter(x=>x.id!==id);toast('ポストを削除しました')}
    save();const y=$('scroll').scrollTop;render();$('scroll').scrollTop=y;
  }
});

// 自分の投稿をダブルタップで日時変更
function editDate(el){
  const p=state.posts.find(x=>x.id===+el.dataset.id);if(!p)return;
  openDate(p.t,t2=>{p.t=t2;sortMine();save();const y=$('scroll').scrollTop;render();$('scroll').scrollTop=y;toast('日時を変更しました')});
}
let lastTap={id:null,t:0};
$('scroll').addEventListener('touchend',e=>{
  const el=e.target.closest('.post[data-mine="1"]');if(!el||e.target.closest('button,a'))return;
  const now=Date.now();
  if(lastTap.id===el.dataset.id&&now-lastTap.t<350){e.preventDefault();lastTap={id:null,t:0};editDate(el)}
  else lastTap={id:el.dataset.id,t:now};
});
$('scroll').addEventListener('dblclick',e=>{
  if(e.target.closest('button,a'))return;
  const el=e.target.closest('.post[data-mine="1"]');if(el){e.preventDefault();editDate(el)}
});

// スワイプでメニュー開閉
let sx=null,sy=0;
app.addEventListener('touchstart',e=>{const x=e.touches[0].clientX-app.getBoundingClientRect().left;const open=app.classList.contains('drawer-open');sx=(open||(state.view==='home'&&x<60)||x<20)?e.touches[0].clientX:null;sy=e.touches[0].clientY},{passive:true});
app.addEventListener('touchend',e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx,dy=Math.abs(e.changedTouches[0].clientY-sy);if(dy<60&&!$('sheet').classList.contains('open')){if(dx>60)openDrawer();if(dx<-60)closeDrawer()}sx=null},{passive:true});

const ta=$('ta');
let draftImgs=[],draftT=null,dlgCb=null;
const toLocal=t=>{const d=new Date(t);return d.getFullYear()+'-'+z2(d.getMonth()+1)+'-'+z2(d.getDate())+'T'+z2(d.getHours())+':'+z2(d.getMinutes())};
const shortDate=t=>{const d=new Date(t),now=new Date();return (d.getFullYear()!==now.getFullYear()?d.getFullYear()+'/':'')+(d.getMonth()+1)+'/'+d.getDate()+' '+d.getHours()+':'+z2(d.getMinutes())};
function openDate(t,cb){$('dt').value=toLocal(t||Date.now());dlgCb=cb;$('dlg').classList.add('open')}
const closeDlg=()=>$('dlg').classList.remove('open');
$('dlgCancel').onclick=closeDlg;
$('dlg').addEventListener('click',e=>{if(e.target.id==='dlg')closeDlg()});
$('dlgNow').onclick=()=>{$('dt').value=toLocal(Date.now())};
$('dlgOk').onclick=()=>{const v=$('dt').value;if(!v){toast('日時を入力してください');return}const t2=new Date(v).getTime();if(isNaN(t2)){toast('日時の形式が正しくありません');return}closeDlg();if(dlgCb)dlgCb(t2)};

function upd(){const r=MAX-ta.value.length;$('count').textContent=r<=20?String(r):'';$('count').style.color=r<0?'#f4212e':'#536471';$('submit').disabled=!((ta.value.trim()||draftImgs.length)&&r>=0)}
function updDate(){$('dateLbl').textContent=draftT?shortDate(draftT):'今'}
function renderPreviews(){
  $('previews').style.display=draftImgs.length?'flex':'none';
  $('previews').innerHTML=draftImgs.map((src,i)=>`<div class="thumb"><img src="${src}" alt="選択した画像${i+1}"><button data-rm="${i}" aria-label="画像${i+1}を削除"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>`).join('');
}
$('previews').addEventListener('click',e=>{const b=e.target.closest('[data-rm]');if(!b)return;draftImgs.splice(+b.dataset.rm,1);renderPreviews();upd()});
function shrink(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const M=1080,k=Math.min(1,M/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.8))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}
$('file').addEventListener('change',async e=>{
  const files=[...e.target.files];e.target.value='';
  const room=4-draftImgs.length;if(files.length>room)toast('画像は4枚までです');
  for(const f of files.slice(0,Math.max(0,room))){try{draftImgs.push(await shrink(f))}catch(err){toast('この画像は読み込めませんでした')}}
  renderPreviews();upd();
});
$('dateBtn').onclick=()=>openDate(draftT||Date.now(),t2=>{draftT=t2;updDate()});
function openSheet(){$('sheet').classList.add('open');ta.value='';draftImgs=[];draftT=null;renderPreviews();updDate();upd();setTimeout(()=>ta.focus(),50)}
function closeSheet(){$('sheet').classList.remove('open');ta.blur()}
$('sheetAvatar').innerHTML=`<img src="${ME.img}" alt="" style="width:100%;height:100%;object-fit:cover;display:block">`;
$('fab').onclick=openSheet;$('cancel').onclick=closeSheet;ta.addEventListener('input',upd);
$('submit').onclick=()=>{
  state.posts.unshift({id:Date.now(),t:draftT||Date.now(),text:ta.value.trim(),images:[...draftImgs],likes:0,liked:false,rt:false,bm:false,views:0});
  sortMine();save();closeSheet();state.tab='posts';render();$('scroll').scrollTop=0;toast('ポストしました');
};
save();renderDrawer();render();
// PWA: オフライン用サービスワーカー（対応環境のみ）
try{if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw3.js').catch(()=>{})}catch(e){}
</script>
